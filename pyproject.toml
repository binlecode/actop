[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "actop"
version = "1.6.4"
description = "Apple Silicon (M1–M4) power, GPU, ANE & memory-bandwidth monitor — sudoless TUI + Python API for profiling local LLM / MLX / CoreML inference"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "binlecode", email = "bin.le.code@gmail.com" },
]
keywords = ["actop", "apple-silicon", "ioreport", "performance-monitor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
]
requires-python = ">=3.11"
dependencies = [
  "textual>=0.60",
  "rich>=13.0",  # imported directly (tui/widgets.py); do not rely on textual's transitive pin
]

[project.optional-dependencies]
# ruff unpinned again as of 1.4.16: the tree is now compliant under 0.16 and
# the rule set is codified in [tool.ruff.lint] below, so CI no longer depends
# on ruff's default select (whose 0.16.0 expansion had broken the gate).
dev = ["ruff", "pytest"]
pandas = ["pandas>=1.3"]
# ANE load generator (scripts/ane_load.py) only; macOS-only + heavy, kept out
# of `dev` so Linux CI (`pip install -e ".[dev]"`) stays lean and green.
ane = ["coremltools>=7.0", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/binlecode/actop"
Repository = "https://github.com/binlecode/actop"

[project.scripts]
actop = "actop.actop:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: macOS-only tests requiring IOReport, vm_stat, or Apple Silicon hardware",
]

[tool.ruff.lint]
# Explicit rule set so CI/local no longer ride ruff's shifting defaults —
# ruff 0.16.0 silently expanded its default select and broke the previously
# green lint gate (see CHANGELOG 1.4.14). `E4/E7/E9/F` is ruff's recommended
# default equivalent; the rest are opt-in modernization/correctness families.
# Deliberately NOT selected: `BLE`/`S` (blind-except & bandit — the native
# ctypes/IOKit/SMC reads intentionally catch broad Exception and fail silent),
# `EXE`/`PLW` (skill & scratch helper scripts).
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "PIE", "RUF"]
ignore = [
    "RUF001",  # ambiguous-unicode (string): the TUI intentionally uses —, ·, ×, braille
    "RUF002",  # ambiguous-unicode (docstring)
    "RUF003",  # ambiguous-unicode (comment)
    "RUF012",  # mutable-class-default: Textual `BINDINGS = [...]` is the framework idiom
]

[tool.setuptools.packages.find]
include = ["actop*"]
