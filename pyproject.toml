[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "actop"
version = "1.4.15"
description = "Apple Silicon (M1–M4) power, GPU, ANE & memory-bandwidth monitor — sudoless TUI + Python API for profiling local LLM / MLX / CoreML inference"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "binlecode", email = "bin.le.code@gmail.com" },
]
keywords = ["actop", "apple-silicon", "ioreport", "performance-monitor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
]
requires-python = ">=3.11"
dependencies = [
  "textual>=0.60",
  "rich>=13.0",  # imported directly (tui/widgets.py); do not rely on textual's transitive pin
]

[project.optional-dependencies]
# ruff capped below 0.16: 0.16.0 expanded its default rule set, turning a
# previously-clean tree into 126 lint errors and breaking the CI lint gate.
# Pin to the last-compatible line until the code is brought into 0.16 compliance.
dev = ["ruff>=0.15,<0.16", "pytest"]
pandas = ["pandas>=1.3"]
# ANE load generator (scripts/ane_load.py) only; macOS-only + heavy, kept out
# of `dev` so Linux CI (`pip install -e ".[dev]"`) stays lean and green.
ane = ["coremltools>=7.0", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/binlecode/actop"
Repository = "https://github.com/binlecode/actop"

[project.scripts]
actop = "actop.actop:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: macOS-only tests requiring IOReport, vm_stat, or Apple Silicon hardware",
]

[tool.setuptools.packages.find]
include = ["actop*"]
