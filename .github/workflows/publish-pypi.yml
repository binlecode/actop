name: publish-pypi
run-name: "publish-pypi | ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }} | ${{ github.sha }}"

# Publishes the actop package to PyPI using PyPI Trusted Publishing (OIDC) —
# no API token is stored in the repo.
#
# MANUAL ONLY — this workflow does NOT run on tag push. Publishing is a
# deliberate step taken AFTER the tag and its CI have landed, because the
# automatic form was self-defeating: a tag push started the publish at the same
# moment the tag appeared, so the run raced the release it was meant to ship and
# never published against a settled tag. Making it a dispatch that takes the tag
# as an input removes the ordering problem entirely — the tag already exists and
# is named explicitly.
#
# Publish with (after `scripts/tag_release.sh` and green CI):
#   gh workflow run publish-pypi.yml --ref vX.Y.Z -f tag_name=vX.Y.Z
#
# `--ref` must be the TAG, not a branch: the `pypi` environment's deployment
# policy only admits refs matching `v*`, so a dispatch from main is rejected
# before the job starts. Pointing it at the tag satisfies the policy and keeps
# the "only a tagged commit ever reaches PyPI" guarantee that the old automatic
# trigger provided.
#
# Local fallback, from a clean checkout of the tag (needs a PyPI API token —
# OIDC is only available to the workflow above):
#   python -m build && python -m twine upload --skip-existing dist/*
#
# One-time PyPI-side setup (do this once, signed in as the project owner):
#   1. https://pypi.org/manage/account/publishing/  ->  "Add a new pending publisher"
#   2. Project name: actop
#      Owner: binlecode
#      Repository name: actop
#      Workflow name: publish-pypi.yml
#      Environment name: pypi
#   After the first successful publish the pending publisher becomes a normal
#   trusted publisher for the project.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (for example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(
            awk '
              /^\[project\]/ { in_project=1; next }
              /^\[/ && in_project { in_project=0 }
              in_project && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
            ' pyproject.toml
          )"
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) does not match pyproject.toml version ($PROJECT_VERSION)" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          skip-existing: true
